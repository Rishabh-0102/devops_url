version: '3.9'

services:

  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - backend
    networks:
      - url-shortener-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:3000"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - url-shortener-network


  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/urlshortener
      - JWT_SECRET=mysecretkey
      - NODE_ENV=development
    depends_on:
      - mongo
    networks:
      - url-shortener-network


  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - url-shortener-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  mongo-data:

networks:
  url-shortener-network: